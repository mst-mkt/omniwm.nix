name: Update

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate settings-defaults.toml even without a version change"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  update:
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      old: ${{ steps.bump.outputs.old }}
      new: ${{ steps.bump.outputs.new }}
      regen: ${{ steps.plan.outputs.regen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: Update omniwm version
        id: bump
        run: |
          echo "old=$(nix eval --raw .#packages.aarch64-darwin.omniwm.version)" >> "$GITHUB_OUTPUT"
          nix run --inputs-from . nixpkgs#nix-update -- --flake omniwm
          echo "new=$(nix eval --raw .#packages.aarch64-darwin.omniwm.version)" >> "$GITHUB_OUTPUT"
      - name: Build the updated package
        if: steps.bump.outputs.old != steps.bump.outputs.new
        run: nix build .#omniwm
      - name: Decide whether to regenerate the template
        id: plan
        env:
          FORCE_REGEN: ${{ inputs.regenerate }}
        run: |
          regen=false
          git diff --quiet || regen=true
          if [ ! -f settings-defaults.toml ]; then regen=true; fi
          if [ "$FORCE_REGEN" = "true" ]; then regen=true; fi
          echo "regen=$regen" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: nix/package.nix

  generate:
    needs: update
    if: needs.update.outputs.regen == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      schema-changed: ${{ steps.schema.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: nix
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: Regenerate settings defaults
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          nix run --inputs-from . nixpkgs#nushell -- codegen/generate-defaults.nu
      - name: Validate template
        run: |
          nix eval --impure --expr \
            'let t = builtins.fromTOML (builtins.readFile ./settings-defaults.toml); in assert t ? schemaVersion && t ? hotkeys && t.hotkeys != [ ]; "ok"'
      - name: Detect a schema change
        id: schema
        run: |
          changed=false
          if git diff -U0 -- settings-defaults.toml | grep -q '^[+-]schemaVersion[[:space:]]*='; then changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template
          path: settings-defaults.toml

  publish:
    needs: [update, generate]
    if: ${{ !cancelled() && needs.update.result == 'success' && needs.generate.result != 'failure' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLD: ${{ needs.update.outputs.old }}
      NEW: ${{ needs.update.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: nix
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.generate.result == 'success'
        with:
          name: template
          path: .
      - name: Configure the git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit and push
        if: needs.generate.outputs.schema-changed != 'true'
        run: |
          if [ "$OLD" = "$NEW" ]; then msg="chore: regenerate settings defaults"; else msg="chore: update omniwm ($OLD -> $NEW)"; fi
          git add -A
          git diff --cached --quiet || (git commit -m "$msg" && git push)
      - name: Open a pull request for the schema change
        if: needs.generate.outputs.schema-changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git commit -m "chore: update omniwm ($OLD -> $NEW, settings schema change)"
          git push --force origin HEAD:update/schema-change
          if [ "$(gh pr list --head update/schema-change --state open --json number --jq length)" = 0 ]; then
            gh pr create --base main --head update/schema-change --title "Update omniwm ($OLD -> $NEW, settings schema change)" --body "The settings schema version changed; review the template diff before merging."
          fi

  report-failure:
    needs: [update, generate, publish]
    if: failure()
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the failure issue
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --state open --search '"Update workflow failed" in:title' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $url"
          else
            gh issue create --title "Update workflow failed" --body "See $url"
          fi
