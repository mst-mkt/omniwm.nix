language: en-US

reviews:
  profile: assertive
  request_changes_workflow: true
  abort_on_close: true

  review_details: true
  review_status: true
  in_progress_fortune: false
  poem: false
  sequence_diagrams: false
  estimate_code_review_effort: false

  path_filters:
    - "!**/flake.lock"

  path_instructions:
    - path: "settings-defaults.toml"
      instructions: |
        Generated by codegen/generate-defaults.nu, so never suggest hand-editing it.
        Review it as a schema diff: nix/module.nix reads it with fromTOML and merges user settings over it, matching `hotkeys` entries by `id`.
        Flag changes that nix/module.nix or README.md has to follow, such as a `schemaVersion` bump, a different shape for `hotkeys` entries, or added, removed and renamed keys.
    - path: "nix/module.nix"
      instructions: |
        The merge logic and options must stay consistent with the keys in settings-defaults.toml, which this file reads at evaluation time.
        Check that user-facing option changes reach README.md.

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0

code_generation:
  docstrings:
    language: en-US
